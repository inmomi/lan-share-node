name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 端到端测试 (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: node --check server.js

      # 测试脚本会自己拉起服务、跑完再关掉，避免各平台后台进程写法的差异。
      - name: 运行端到端测试
        env:
          SPAWN: node server.js
          BASE: http://127.0.0.1:8080
          TRAVERSAL_PROBE: server.js
        run: node test.js

  # Windows 打包仅供双击启动，不参与测试（CI 里已通过 start 脚本等价覆盖）
  smoke-windows-bat:
    name: 启动脚本可运行 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 通过 start.bat 启动并验证
        shell: cmd
        env:
          TEST_URL: http://127.0.0.1:8080
        run: |
          start "" /B cmd /c start.bat
          powershell -Command "$ok=$false; for($i=0;$i -lt 30;$i++){ Start-Sleep -Seconds 1; try{ $r=Invoke-WebRequest -Uri $env:TEST_URL -UseBasicParsing -TimeoutSec 3; if($r.StatusCode -eq 200){ $ok=$true; break } }catch{} }; if(-not $ok){ exit 1 }"
          taskkill /F /IM node.exe
