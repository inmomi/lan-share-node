<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAN Share · 局域网文件分享</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo"></span>
    <div class="brand-text">
      <h1>LAN Share</h1>
      <p class="sub">局域网点对点直传 + 服务端文件库</p>
    </div>
  </div>
  <div class="me">
    <label for="myName">本机名称</label>
    <input id="myName" maxlength="24" spellcheck="false" autocomplete="off">
    <span id="peerCount" class="badge">0 台设备</span>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="p2p">设备直传</button>
  <button class="tab" data-tab="vault">服务端文件库</button>
</nav>

<main>
  <section id="pane-p2p" class="pane active">
    <p class="hint">点击设备卡片选择文件，或把文件直接拖到卡片上。这条路径走浏览器点对点通道，文件内容不经过服务端。</p>
    <div id="peerGrid" class="peer-grid"></div>
    <div id="transferList" class="transfer-list"></div>
  </section>

  <section id="pane-vault" class="pane">
    <div id="dropzone" class="dropzone">
      <strong>拖放文件到这里上传</strong>
      <span class="or">或</span>
      <button id="pickVault" class="btn">选择文件</button>
      <small>文件保存在服务端磁盘上，任何设备随时都能下载</small>
    </div>
    <div id="vaultMeta" class="vault-meta"></div>
    <ul id="vaultList" class="vault-list"></ul>
  </section>
</main>

<input id="peerPicker" type="file" multiple hidden>
<input id="vaultPicker" type="file" multiple hidden>

<div id="toasts" class="toasts"></div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="modalTitle">收到文件</h3>
    <p id="modalBody"></p>
    <div class="modal-actions">
      <button id="modalNo" class="btn">拒绝</button>
      <button id="modalYes" class="btn primary">接收</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
